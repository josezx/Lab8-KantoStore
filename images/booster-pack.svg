<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="foilPouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="crimpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="25%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="packSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
  </defs>

  <!-- Top Crimp Heat Seal -->
  <rect x="20" y="20" width="280" height="25" fill="url(#crimpGrad)" rx="2"/>
  <!-- Hanging Hole -->
  <ellipse cx="160" cy="32" rx="14" ry="4" fill="#0f172a"/>

  <!-- Main Foil Pouch -->
  <rect x="20" y="45" width="280" height="390" fill="url(#foilPouch)"/>
  
  <!-- Artwork in Center -->
  <circle cx="160" cy="210" r="90" fill="#2e1065" stroke="#facc15" stroke-width="3"/>
  <!-- Mew/Gengar Silhouette graphic -->
  <ellipse cx="160" cy="225" rx="55" ry="50" fill="#c084fc"/>
  <circle cx="140" cy="185" r="16" fill="#c084fc"/>
  <circle cx="180" cy="185" r="16" fill="#c084fc"/>
  <circle cx="160" cy="205" r="38" fill="#e9d5ff"/>
  <circle cx="145" cy="200" r="6" fill="#6b21a8"/>
  <circle cx="175" cy="200" r="6" fill="#6b21a8"/>

  <!-- Titles on Pack -->
  <text x="160" y="100" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#facc15" text-anchor="middle">DESTINOS DE PALDEA</text>
  <text x="160" y="125" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#f8fafc" text-anchor="middle">POKÉMON TCG</text>

  <text x="160" y="340" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">SOBRE DE MEJORA</text>
  <text x="160" y="365" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#e9d5ff" text-anchor="middle">10 CARTAS ADICIONALES</text>

  <!-- Bottom Crimp -->
  <rect x="20" y="435" width="280" height="25" fill="url(#crimpGrad)" rx="2"/>
  <!-- Sheen -->
  <rect x="20" y="45" width="280" height="390" fill="url(#packSheen)" opacity="0.6"/>
</svg>
