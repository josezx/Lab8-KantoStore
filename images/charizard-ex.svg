<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <radialGradient id="fireBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="holoOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="30%" stop-color="rgba(236,72,153,0.2)"/>
      <stop offset="70%" stop-color="rgba(59,130,246,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
    </linearGradient>
  </defs>

  <!-- Card Border -->
  <rect x="10" y="10" width="380" height="540" rx="20" fill="#0f172a" stroke="url(#goldBorder)" stroke-width="8"/>
  
  <!-- Card Header -->
  <rect x="25" y="25" width="350" height="42" rx="10" fill="#1e293b"/>
  <text x="40" y="53" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#f8fafc">Charizard ex</text>
  <text x="315" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#ef4444">330 HP</text>

  <!-- Illustration Window -->
  <rect x="25" y="78" width="350" height="250" rx="14" fill="url(#fireBg)" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Fire Flame Art & Silhouette -->
  <g transform="translate(100, 95)">
    <!-- Wings Silhouette -->
    <path d="M 40 100 C 10 40 -30 20 -70 50 C -40 100 0 120 40 100 Z" fill="#b45309" opacity="0.8"/>
    <path d="M 160 100 C 190 40 230 20 270 50 C 240 100 200 120 160 100 Z" fill="#b45309" opacity="0.8"/>
    
    <!-- Charizard Body & Head -->
    <ellipse cx="100" cy="130" rx="50" ry="70" fill="#ea580c"/>
    <ellipse cx="98" cy="140" rx="36" ry="50" fill="#fef08a"/>
    <circle cx="100" cy="55" r="32" fill="#ea580c"/>
    <!-- Snout & Horns -->
    <polygon points="100,30 85,-5 95,25" fill="#c2410c"/>
    <polygon points="115,30 135,-5 110,25" fill="#c2410c"/>
    <path d="M 80 55 Q 100 40 125 55 Q 100 70 80 55 Z" fill="#fb923c"/>
    <!-- Eyes -->
    <ellipse cx="88" cy="48" rx="4" ry="7" fill="#38bdf8"/>
    <ellipse cx="112" cy="48" rx="4" ry="7" fill="#38bdf8"/>
    
    <!-- Fire Breath Swirls -->
    <path d="M 100 68 Q 60 110 -20 100 Q 20 80 100 68 Z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="-15" cy="95" r="14" fill="#ef4444"/>
    <circle cx="215" cy="85" r="10" fill="#f59e0b"/>
  </g>

  <!-- Holo Light Reflection -->
  <rect x="25" y="78" width="350" height="250" rx="14" fill="url(#holoOverlay)"/>

  <!-- Attacks Box -->
  <rect x="25" y="340" width="350" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  
  <text x="40" y="375" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Habilidad: Fuego Volcánico</text>
  <text x="40" y="398" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Una vez durante tu turno, puedes buscar hasta 3 cartas de Energía.</text>

  <line x1="40" y1="415" x2="360" y2="415" stroke="#334155" stroke-width="1"/>

  <text x="40" y="445" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Torbellino Ardiente</text>
  <text x="315" y="445" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#f59e0b">330</text>
  <text x="40" y="468" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Descarta 2 Energías unidas a este Pokémon.</text>

  <!-- Footer Info -->
  <text x="40" y="522" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">199/165 ★★★ Ultra Rara | Escarlata y Púrpura 151</text>
</svg>
