<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Pokéball Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Ring -->
    <circle cx="22" cy="22" r="21" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="2.5" />
    <!-- Top Half (Red/Amber) -->
    <path d="M 3 22 A 19 19 0 0 1 41 22 Z" fill="url(#amberGrad)" />
    <!-- Bottom Half (White) -->
    <path d="M 3 22 A 19 19 0 0 0 41 22 Z" fill="#f8fafc" />
    <!-- Center Line -->
    <line x1="2" y1="22" x2="42" y2="22" stroke="#0f172a" stroke-width="3.5" />
    <!-- Outer Center Button -->
    <circle cx="22" cy="22" r="7.5" fill="#0f172a" />
    <circle cx="22" cy="22" r="5" fill="#f8fafc" stroke="url(#blueGrad)" stroke-width="1.5" />
    <circle cx="22" cy="22" r="2" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Text -->
  <text x="65" y="32" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="22" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
    KANTO<tspan fill="url(#amberGrad)">STORE</tspan>
  </text>
  <text x="66" y="46" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="2.5">
    POKÉMON TCG SPECIALISTS
  </text>
</svg>
