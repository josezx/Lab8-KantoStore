<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <radialGradient id="psychicGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="vstarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="380" height="540" rx="20" fill="#0f172a" stroke="url(#vstarBorder)" stroke-width="8"/>

  <!-- Card Header -->
  <rect x="25" y="25" width="350" height="42" rx="10" fill="#1e293b"/>
  <text x="40" y="53" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#f8fafc">Mewtwo VSTAR</text>
  <text x="315" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#c084fc">280 HP</text>

  <!-- Illustration Window -->
  <rect x="25" y="78" width="350" height="250" rx="14" fill="url(#psychicGrad)" stroke="#a855f7" stroke-width="2"/>
  
  <!-- Psychic aura rings -->
  <circle cx="200" cy="190" r="95" fill="none" stroke="#f3e8ff" stroke-width="3" opacity="0.6"/>
  <circle cx="200" cy="190" r="70" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="190" r="45" fill="#f3e8ff" opacity="0.4"/>

  <!-- Mewtwo Silhouette Head & Eyes -->
  <g transform="translate(160, 130)">
    <path d="M 40 20 Q 20 0 10 35 Q 20 70 40 90 Q 60 70 70 35 Q 60 0 40 20 Z" fill="#e9d5ff"/>
    <ellipse cx="25" cy="45" rx="5" ry="3" fill="#6b21a8"/>
    <ellipse cx="55" cy="45" rx="5" ry="3" fill="#6b21a8"/>
    <path d="M 30 90 Q 40 120 50 90 Z" fill="#c084fc"/>
  </g>

  <!-- Attacks Box -->
  <rect x="25" y="340" width="350" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="375" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Onda Psíquica</text>
  <text x="315" y="375" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#c084fc">90+</text>
  <text x="40" y="398" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Hace 30 puntos de daño adicionales por cada Energía unida a ambos.</text>

  <line x1="40" y1="415" x2="360" y2="415" stroke="#334155" stroke-width="1"/>

  <rect x="40" y="425" width="80" height="22" rx="4" fill="#a855f7"/>
  <text x="50" y="440" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" fill="#ffffff">ASTRO PODER</text>
  <text x="130" y="442" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Estrella Gravitacional</text>
  <text x="315" y="442" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#c084fc">120x</text>

  <text x="40" y="522" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#c084fc">GG44/GG70 ★★★ Ultra Rara | Zenit Supremo</text>
</svg>
