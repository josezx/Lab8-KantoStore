<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <radialGradient id="electricBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <linearGradient id="secretBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="380" height="540" rx="20" fill="#0f172a" stroke="url(#secretBorder)" stroke-width="8"/>

  <!-- Card Header -->
  <rect x="25" y="25" width="350" height="42" rx="10" fill="#1e293b"/>
  <text x="40" y="53" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#f8fafc">Pikachu ex (IR)</text>
  <text x="315" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#facc15">200 HP</text>

  <!-- Illustration Window -->
  <rect x="25" y="78" width="350" height="250" rx="14" fill="url(#electricBg)" stroke="#ca8a04" stroke-width="2"/>
  
  <!-- Pikachu illustration -->
  <g transform="translate(140, 110)">
    <!-- Ears -->
    <polygon points="20,10 -15,-45 5,-35" fill="#fde047"/>
    <polygon points="-15,-45 -5,-25 5,-35" fill="#0f172a"/>
    <polygon points="100,10 135,-45 115,-35" fill="#fde047"/>
    <polygon points="135,-45 125,-25 115,-35" fill="#0f172a"/>

    <!-- Body -->
    <ellipse cx="60" cy="110" rx="60" ry="70" fill="#facc15"/>
    <!-- Head -->
    <circle cx="60" cy="45" r="48" fill="#fde047"/>
    <!-- Cheeks -->
    <circle cx="28" cy="55" r="14" fill="#ef4444"/>
    <circle cx="92" cy="55" r="14" fill="#ef4444"/>
    <!-- Eyes -->
    <circle cx="42" cy="40" r="7" fill="#0f172a"/>
    <circle cx="44" cy="38" r="2.5" fill="#ffffff"/>
    <circle cx="78" cy="40" r="7" fill="#0f172a"/>
    <circle cx="76" cy="38" r="2.5" fill="#ffffff"/>
    <!-- Nose & Smile -->
    <ellipse cx="60" cy="48" rx="2" ry="1.5" fill="#0f172a"/>
    <path d="M 52 56 Q 60 64 68 56" stroke="#0f172a" stroke-width="2.5" fill="none"/>
    <!-- Lightning Bolt Sparks -->
    <polygon points="-60,40 -20,10 -30,45 10,25 -20,65" fill="#ffffff" opacity="0.9"/>
    <polygon points="140,60 170,30 155,70 190,50 160,95" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Attacks Box -->
  <rect x="25" y="340" width="350" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="375" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Rayo Creador</text>
  <text x="315" y="375" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#facc15">60</text>
  <text x="40" y="398" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Une hasta 2 cartas de Energía Eléctrica de tu pila de descartes.</text>

  <line x1="40" y1="415" x2="360" y2="415" stroke="#334155" stroke-width="1"/>

  <text x="40" y="445" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Impactrueno Estelar</text>
  <text x="315" y="445" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#facc15">220</text>
  <text x="40" y="468" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Este ataque hace 30 puntos de daño a 1 Pokémon en banca rival.</text>

  <text x="40" y="522" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#facc15">238/191 ★★★★ Rara Ilustración Secreta | Corona Astral</text>
</svg>
