<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" width="340" height="480">
  <defs>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="300" height="440" rx="16" fill="url(#deckGrad)" stroke="#3b82f6" stroke-width="3"/>

  <!-- Deck Window with Holographic Miraidon display -->
  <rect x="50" y="60" width="240" height="230" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="170" cy="170" r="75" fill="#1e293b"/>
  <!-- Futuristic Dragon Mech shape -->
  <polygon points="170,120 130,190 170,175 210,190" fill="#38bdf8"/>
  <circle cx="170" cy="155" r="15" fill="#facc15"/>
  <ellipse cx="170" cy="210" rx="50" ry="20" fill="#2563eb"/>

  <text x="170" y="325" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle">MAZO DE COMBATE</text>
  <text x="170" y="350" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#38bdf8" text-anchor="middle">MIRAIDON EX (LIGA)</text>

  <!-- Deck Specs Box -->
  <rect x="50" y="375" width="240" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="170" y="400" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">60 Cartas Listas Para Jugar</text>
  <text x="170" y="420" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Incluye Caja Portamazo + Contadores</text>
</svg>
